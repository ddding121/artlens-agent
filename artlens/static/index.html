<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="上传画作，探索视觉细节、候选馆藏与有来源的艺术解读。"><title>ArtLens · 艺术鉴赏工作台</title><link rel="stylesheet" href="/static/style.css?v=0.1.2"><script src="/static/render.js?v=0.1.2" defer></script><script src="/static/app.js?v=0.1.2" defer></script></head>
<body><header><a class="brand" href="/">ArtLens<span>艺术鉴赏工作台</span></a><span class="edition">RESEARCH EDITION / 0.1.2</span></header>
<main><section class="workspace"><div class="intro"><span class="eyebrow">01 / 观察作品</span><h1>从一幅画开始。</h1><p>上传画作，探索它的细节、背景与可能的含义。</p></div>
<form id="uploadForm"><label class="drop" id="drop" for="file"><img id="preview" alt="所选画作预览" hidden><span id="uploadHint"><b>＋</b><strong>选择图片或拖放到这里</strong><small>JPG、PNG、WebP · 最大 10 MB</small></span><input id="file" type="file" accept="image/jpeg,image/png,image/webp" required></label><div class="fileline"><span id="filename">尚未选择图片</span><button type="button" id="clear" class="textbtn">清除</button></div><button id="analyze" class="primary" type="submit">分析画作 <span>↗</span></button></form>
<p class="privacy">分析时，图片会发送至你配置的 AI 服务。应用不将上传图片写入磁盘；清除后删除当前会话。</p><div class="readiness" id="readiness" role="status">正在检查服务…</div></section>
<section class="results" aria-live="polite"><div class="sectionhead"><span class="eyebrow">02 / 发现与解读</span><span id="identity" class="badge">等待上传</span></div><p id="progress" role="status" hidden></p><section id="evidence" hidden aria-label="识别依据"></section><div id="warnings" role="status"></div><div id="empty"><span class="empty-number">Aa</span><h2>每一幅画，都值得仔细看。</h2><p>分析结果将在这里呈现。我们会将画面观察、资料事实和艺术解读分开说明。</p></div><article id="answer" hidden></article><section id="sources" hidden><h2>候选馆藏与来源</h2><p class="caption">相似度用于排序，不代表作者判断的正确概率。</p><div id="cards"></div></section><section id="conversation" hidden><h2>继续探索</h2><div id="messages"></div><form id="chatForm"><label class="sr" for="question">关于这幅画的问题</label><textarea id="question" maxlength="2000" placeholder="例如：这幅画的配色带来怎样的情绪？" rows="2" required></textarea><button id="send" type="submit" class="primary">发送问题</button></form><p id="chatError" role="alert"></p></section></section></main><footer>ArtLens / 有来源的事实，有边界的解读。<span>图片匹配不构成真伪鉴定。</span></footer></body></html>
